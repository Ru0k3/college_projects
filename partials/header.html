<header class="site-header">
  <div class="container topbar">
    <div class="topbar__left">
      <a href="index.html" class="brand">VoxGrid</a>
      <nav aria-label="Primary">
        <ul class="topnav">
          <li>
            <a href="issue_categories.html" class="topnav__link">Categories</a>
          </li>
          <li>
            <a href="about-us.html" class="topnav__link">About</a>
          </li>
        </ul>
      </nav>
    </div>
    <div class="topbar__right">
      <label class="search" aria-label="Search">
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5"></circle>
          <path d="M13 13l3.5 3.5"></path>
        </svg>
        <input type="text" placeholder="Search..." />

      <button
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark theme"

          <span class="theme-toggle__thumb">
            <span class="theme-toggle__icon">☀️</span>

      <button
        class="audio-toggle"
        type="button"
        aria-label="Play background audio"

        title="Play background audio"
      >
        <span class="material-symbols-outlined audio-toggle__icon" aria-hidden="true">
