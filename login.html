<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Login | VoxGrid</title>
		<link rel="stylesheet" href="css/login.css" />
	</head>
	<body>
		<main class="login-page">
			<section class="login-card" aria-labelledby="login-title">
				<h1 id="login-title">Sign In</h1>
				<p>Access your VoxGrid account.</p>

				<form
					id="login-form"
					data-endpoint="/api/login"
					data-redirect="issue_categories.html"
					novalidate
				>
					<label class="field" for="email">
						<span>Email</span>
						<input
							id="email"
							name="email"
							type="email"
							autocomplete="email"
							placeholder="name@example.com"
							required
						/>
					</label>

					<label class="field" for="password">
						<span>Password</span>
						<input
							id="password"
							name="password"
							type="password"
							autocomplete="current-password"
							placeholder="Enter your password"
							required
						/>
					</label>

					<div class="row">
						<label class="remember" for="remember">
							<input id="remember" name="remember" type="checkbox" />
							<span>Keep me signed in</span>
						</label>
						<a class="forgot-link" href="#">Forgot password?</a>
					</div>

					<button id="login-submit" type="submit">Sign In</button>
					<p id="login-status" class="status" role="status" aria-live="polite"></p>
					<p class="switch-auth">
						New here? <a href="register.html">Create an account</a>
					</p>
				</form>
			</section>
		</main>
		<script type="module" src="js/pages/login.js"></script>
	</body>
</html>
